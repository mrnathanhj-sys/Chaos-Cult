<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1512">
<meta name="description" content="Chaos Cult gang builder, battle tracker and searchable rules for Necromunda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eightfold Path">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Eightfold Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with three route tabs; builder = settings rail + fighter cards; play = tracker strip, articles, fighter cards; rules = searchable codex */
:root{
  --bg:#e8e4e1; --surface:#f6f3f1; --sunk:#ddd7d2; --line:#c9bfb8; --fg:#24140f; --muted:#6c5a51;
  --blood:#9b1c14;  --brass:#86651f; --brass-soft:#86651f22;
  --ok:#2f6b3a; --warn:#9a5b06; --err:#a3170f;
  --display:"Pirata One","UnifrakturCook",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --on-blood:#fff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150e0c; --surface:#1f1512; --sunk:#2a1d18; --line:#3d2b24; --fg:#ece2d4; --muted:#a8968a;
  --blood:#d6443a;  --brass:#cfa85c; --brass-soft:#cfa85c22;
  --ok:#6cbf7a; --warn:#e2a54a; --err:#ee6157; --on-blood:#140d0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150e0c; --surface:#1f1512; --sunk:#2a1d18; --line:#3d2b24; --fg:#ece2d4; --muted:#a8968a;
  --blood:#d6443a;  --brass:#cfa85c; --brass-soft:#cfa85c22;
  --ok:#6cbf7a; --warn:#e2a54a; --err:#ee6157; --on-blood:#140d0b; color-scheme:dark}
:root{--blood-soft:color-mix(in srgb,var(--blood) 13%,transparent)}
:root[data-ded="nurgle"] :is(.fc,.tc){--blood:#4d6a12;--bg:#e3e6d6;--surface:#f2f4ea;--sunk:#d6dbc4;--line:#bfc6a6;--muted:#5b6247;}:root[data-ded="tzeentch"] :is(.fc,.tc){--blood:#1f4fa3;--bg:#dfe4ee;--surface:#f1f4f9;--sunk:#d0d8e7;--line:#b6c2d8;--muted:#4f5b72;}:root[data-ded="slaanesh"] :is(.fc,.tc){--blood:#9a2a87;--bg:#ebe0ea;--surface:#f7f1f6;--sunk:#dfd0dd;--line:#cbb5c8;--muted:#6b5568;}:root[data-ded="undivided"] :is(.fc,.tc){--blood:#4b4a57;--bg:#e2e1e6;--surface:#f3f3f5;--sunk:#d5d4db;--line:#bdbbc6;--muted:#5b5a66;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-ded="nurgle"] :is(.fc,.tc){--blood:#9cc24b;--bg:#0f130b;--surface:#171c10;--sunk:#212817;--line:#323c22;--muted:#a3ab8e;--fg:#e4e8d6;}:root:not([data-theme="light"])[data-ded="tzeentch"] :is(.fc,.tc){--blood:#6aa0ee;--bg:#0b0f19;--surface:#121827;--sunk:#1a2234;--line:#2a354d;--muted:#97a3bd;--fg:#dfe6f3;}:root:not([data-theme="light"])[data-ded="slaanesh"] :is(.fc,.tc){--blood:#dc6ac8;--bg:#150b14;--surface:#1f121d;--sunk:#2a1827;--line:#3e2539;--muted:#b495ae;--fg:#f0e1ec;}:root:not([data-theme="light"])[data-ded="undivided"] :is(.fc,.tc){--blood:#bdb3c9;--bg:#101014;--surface:#18181e;--sunk:#22222a;--line:#33333e;--muted:#a3a2ae;--fg:#e6e5ec;}}
:root[data-theme="dark"][data-ded="nurgle"] :is(.fc,.tc){--blood:#9cc24b;--bg:#0f130b;--surface:#171c10;--sunk:#212817;--line:#323c22;--muted:#a3ab8e;--fg:#e4e8d6;}:root[data-theme="dark"][data-ded="tzeentch"] :is(.fc,.tc){--blood:#6aa0ee;--bg:#0b0f19;--surface:#121827;--sunk:#1a2234;--line:#2a354d;--muted:#97a3bd;--fg:#dfe6f3;}:root[data-theme="dark"][data-ded="slaanesh"] :is(.fc,.tc){--blood:#dc6ac8;--bg:#150b14;--surface:#1f121d;--sunk:#2a1827;--line:#3e2539;--muted:#b495ae;--fg:#f0e1ec;}:root[data-theme="dark"][data-ded="undivided"] :is(.fc,.tc){--blood:#bdb3c9;--bg:#101014;--surface:#18181e;--sunk:#22222a;--line:#33333e;--muted:#a3a2ae;--fg:#e6e5ec;}
/* Dedication colours apply to fighter cards only; the rest of the app keeps the Khorne palette */
.fc,.tc{--blood-soft:color-mix(in srgb,var(--blood) 13%,transparent)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);transition:background .3s,color .3s;font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.9rem;line-height:1.1}
h3{font-size:1.35rem}
p{margin:0}
a{color:var(--blood)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);transition:background .3s;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:2rem;line-height:1;color:var(--blood)}
.brand small{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem}
.tabs a[aria-current="page"]{background:var(--blood);color:var(--on-blood)}
main{padding-block:20px 60px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:700;font-size:.9rem;line-height:1.2}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--err);border-color:var(--err)}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;font-family:var(--mono);font-size:.78rem}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:.92rem}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.blood{background:var(--blood-soft);color:var(--blood)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* builder layout */
.builder{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){.builder{grid-template-columns:minmax(0,1fr)}.rail{position:static}}
.budget{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.budget i{display:block;height:100%;background:var(--brass)}
.budget.over i{background:var(--err)}
.big{font-family:var(--mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.issues{display:flex;flex-direction:column;gap:6px;font-size:.9rem;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start}
.issues li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px;background:var(--ok)}
.issues li.err::before{background:var(--err)}
.issues li.warn::before{background:var(--warn)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.addgrid button{text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px}
.addgrid button span{font-size:.76rem;color:var(--muted);font-weight:500}

/* fighter cards */
.cards{display:flex;flex-direction:column;gap:12px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fc.leader{border-color:var(--brass)}
.fch{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:linear-gradient(90deg,var(--blood-soft),transparent 70%)}
.fch .nm{font-family:var(--display);font-size:1.45rem;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.fch .ty{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.fch .cost{margin-left:auto;font-family:var(--mono);font-weight:600;white-space:nowrap}
.fch .chev{color:var(--muted);transition:transform .15s}
.fc.open .fch .chev{transform:rotate(90deg)}
.fcb{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto;max-width:100%}
.stats{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;min-width:100%}
.stats th{font-size:.66rem;color:var(--muted);font-weight:600;padding:2px 4px;text-align:center;border-bottom:1px solid var(--line)}
.stats td{text-align:center;padding:4px;font-weight:600}
.stats td.mod{color:var(--blood)}
.stats td.hurt{color:var(--err);text-decoration:underline}
.wtab{border-collapse:collapse;font-size:.8rem;width:100%}
.wtab th{font-size:.66rem;color:var(--muted);text-align:left;padding:3px 5px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.wtab td{padding:4px 5px;border-bottom:1px solid var(--sunk);vertical-align:top}
.wtab td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.wtab td:first-child{font-weight:700;white-space:nowrap}
.wtab td.tr{min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 4px 3px 10px;font-size:.85rem}
.chip b{font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--muted)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:1rem;line-height:1}
.chip button:hover{background:var(--blood-soft);color:var(--blood)}
.sub{display:flex;flex-direction:column;gap:6px}
.rd{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.rd summary{cursor:pointer;padding:5px 10px;font-weight:700;font-size:.88rem;list-style:none}
.rd summary::-webkit-details-marker{display:none}
.rd summary::before{content:"+ ";color:var(--brass)}
.rd[open] summary::before{content:"– "}
.rd p,.rd div.t{padding:0 10px 8px;font-size:.9rem}
.rules-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}

/* play */
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:var(--r);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:4px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.counter{display:flex;align-items:center;justify-content:space-between;gap:8px}
.counter .big{min-width:2ch;text-align:center}
.step{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800;font-size:1.1rem}
.step:hover{border-color:var(--brass)}
.pool{font-family:var(--display);font-size:3rem;line-height:.9;color:var(--blood)}
.dice{display:flex;flex-wrap:wrap;gap:5px}
.die{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;border:1px solid var(--line);background:var(--bg)}
.die.hit{background:var(--blood);border-color:var(--blood);color:var(--on-blood)}
.result{border-left:3px solid var(--brass);padding:8px 12px;background:var(--brass-soft);border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.result.fail{border-color:var(--err);background:var(--blood-soft)}
.result.pass{border-color:var(--ok)}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.art{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:5px}
.art.used{opacity:.5}
.art h4{margin:0;font-family:var(--body);font-weight:800;font-size:.95rem;font-style:italic}
.art .thr{font-family:var(--mono);font-weight:600;color:var(--blood)}
.art p{font-size:.86rem}
.art .f{color:var(--muted)}
.tk{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.tc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tc.st-pinned{border-left:4px solid var(--warn)}
.tc.st-si{border-left:4px solid var(--err)}
.tc.st-broken{border-left:4px solid var(--warn)}
.tc.st-ooa{opacity:.55;border-left:4px solid var(--muted)}
.tc.st-out{opacity:.4}
.tc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tc .hd strong{font-family:var(--display);font-size:1.3rem;font-weight:400}
.fw{display:inline-flex;align-items:center;gap:6px}
.card-back{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.suit{font-family:var(--display);font-size:1.6rem;line-height:1;color:var(--blood)}

/* rules codex */
.codex{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.toc a{color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:4px}
.toc a:hover{background:var(--sunk);color:var(--fg)}
@media (max-width:860px){.codex{grid-template-columns:minmax(0,1fr)}.toc{position:static;flex-direction:row;flex-wrap:wrap}}
.csec{display:flex;flex-direction:column;gap:12px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px;scroll-margin-top:90px}
.rb{display:flex;flex-direction:column;gap:6px;max-width:78ch}
.rb.wide{max-width:none}
.rb h3{color:var(--blood)}
.rb ul,.rb ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.dt{border-collapse:collapse;font-size:.86rem;width:100%}
.dt th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:5px 7px;border-bottom:1px solid var(--sunk);vertical-align:top}
.dt td.c{text-align:center;font-family:var(--mono)}
.dt tr.grp td{font-weight:800;color:var(--brass);background:var(--sunk);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.tick{color:var(--blood);font-weight:800}
.search{width:100%;font-size:1rem;padding:10px 12px}
.hidden-by-search{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;z-index:50;font-size:.9rem}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-3px,1px) rotate(-2deg)}40%{transform:translate(3px,-1px) rotate(2deg)}60%{transform:translate(-2px,0) rotate(-1deg)}80%{transform:translate(2px,1px) rotate(1deg)}}
.brand h1{cursor:default;user-select:none}.brand h1.quake,.recruit.quake,.fc.quake{animation:quake .3s 3}
.fc.dead{opacity:.55}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:stretch}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.off{opacity:.6}
.pch{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pch h3{font-size:1.3rem}
.pickbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;display:flex;flex-direction:column;gap:8px}
@media (max-width:600px){.pickbar{position:static}}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rtile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--fg)}
.rtile strong{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--blood)}
.rtile span{color:var(--muted);font-size:.9rem}
.rtile:hover{border-color:var(--blood)}
.toc a[aria-current="page"]{background:var(--blood-soft);color:var(--blood);font-weight:700}
.crumbs{font-size:.88rem;color:var(--muted)}.crumbs a{color:var(--muted)}
a.btn{text-decoration:none;color:var(--fg);display:inline-block}
.cog{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;transition:transform .3s}
.cog:hover,.cog.on{color:var(--blood);border-color:var(--blood)}.cog.on{transform:rotate(60deg)}
.artsbox>summary{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1rem;padding:10px 12px}
.artlist{display:flex;flex-direction:column;gap:4px}
.artrow{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.artrow summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:.9rem}
.artrow summary::-webkit-details-marker{display:none}
.artrow .thr{font-family:var(--mono);font-weight:600;color:var(--blood);min-width:3ch}
.artrow .an{flex:1;min-width:0;font-weight:700;font-style:italic}
.artrow p{padding:0 10px 8px;font-size:.86rem}.artrow p.f{color:var(--muted)}
.artrow.used{opacity:.55}
.artref td{vertical-align:top}.artref .thr{font-family:var(--mono);font-weight:600;color:var(--blood)}.artref td:nth-child(2){min-width:140px;font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Eightfold Path</h1><small>Chaos Cult</small></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#build" data-route="build">Gang</a>
      <a href="#play" data-route="play">Play</a>
      <a href="#rules" data-route="rules">Rules</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================== DATA ============================== */
const STATK=['M','WS','BS','S','T','W','I','A','Ld','Cl','WP','Int'];

/* All skill sets in Necromunda order, with this gang's god set and Heresy */
function skillSets(){return [...COREKEYS.map(k=>[k,CORESKILL[k]]),[D().god,GODSKILL[D().god]],['Heresy',HERESY]]}
const skillsOf=f=>String(f.skills||'').split(',').map(x=>x.trim()).filter(Boolean);
const setSkills=(f,a)=>{f.skills=a.join(', ')};
function skillText(n){for(const [,L] of skillSets()){const h=L.find(x=>x[0]===n);if(h)return h[1]}const h=ALLSKILLS.find(x=>x[0]===n);return h?h[1]:''}
function skillSetName(n){const hit=skillSets().find(([,L])=>L.some(x=>x[0]===n));if(hit)return hit[0];for(const k in GODSKILL)if(GODSKILL[k].some(x=>x[0]===n))return k;return ''}

function access(type){if(type==='scrunt')return{P:['Nothing'],S:['Nothing']};const row=(SKT[D().key]||KTABLE).find(r=>r[0]===ROWNAME[type]);const cols=skillCols(),P=[],S=[];if(row)row[1].forEach((v,i)=>{if(v==='P')P.push(cols[i]);if(v==='S')S.push(cols[i])});if(type==='sorcerer')P.push('Aetheric Wyrd Powers');return{P,S}}
function undivOf(f){const lead=G.fighters.find(x=>x.type==='apostle');return (f.type==='daemon'?(lead&&lead.undiv):f.undiv)||'vicious'}
function markMods(f){return D().key==='undivided'?UNDIV[undivOf(f)].mods:D().mods}
const markName=()=>D().mark;
function markSummary(f){const d=D();if(d.key==='undivided'){const u=UNDIV[undivOf(f)];return `${u.n}: ${u.t}`}return d.traits.map(t=>t[1]).join(', ')}
function markText(f){const d=D();if(d.key==='undivided')return `Each marked fighter takes one trait: ${Object.values(UNDIV).map(u=>u.n+' ('+u.t+')').join('; ')}.${f?' This fighter: '+markSummary(f)+'.':''}`;return d.traits.map(t=>`${t[0]}: ${t[1]}.`).join(' ')+' Hatred (X): must re-roll failed wound rolls in melee against fighters with that Mark.'}
function xpRule(){const d=D();return d.xp==='triple'?'If the Threshold roll has 3 or more dice showing the same value, the fighter gains +1 XP.':`If the Threshold roll totals ${d.xp[0]} or a multiple of ${d.xp[0]}, the fighter gains +${d.xp[1]} XP.`}
function xpShort(){const d=D();return d.xp==='triple'?`${d.n}: 3+ matching dice = +1 XP`:`${d.n}: total of ${d.xp[0]}, ${d.xp[0]*2}, ${d.xp[0]*3}… = +${d.xp[1]} XP`}
function xpBonus(dice,total){const d=D();if(d.xp==='triple'){const c={};dice.forEach(v=>c[v]=(c[v]||0)+1);return Object.values(c).some(n=>n>=3)?'Three of a kind: +1 XP to the invoking fighter':''}return total%d.xp[0]===0?`${d.n} is pleased: +${d.xp[1]} XP to the invoking fighter`:''}

function validate(){const I=[];const fs=alive();const cnt=t=>fs.filter(f=>f.type===t).length;

 const hier=fs.filter(f=>FT[f.type].hier).length,gf=fs.filter(f=>FT[f.type].gf).length,champs=fs.filter(f=>FT[f.type].champ).length;
 if(hier>gf)I.push(['err',`Leader and Champions (${hier}) outnumber Gang Fighters (${gf}).`]);
 if(G.founding&&champs>2)I.push(['err',`Only 2 Champions at founding (you have ${champs}).`]);
 ALLORDER.forEach(t=>{const T=FT[t];if(T.max<99&&cnt(t)>T.max)I.push(['err',`${T.n}: limit ${T.max} (you have ${cnt(t)}).`])});
 const total=gangCost();if(total>G.budget)I.push(['err',`Over budget by ${total-G.budget} credits.`]);
 if(G.founding){const spec=fs.filter(f=>f.spec).length;if(spec>1)I.push(['err',`Only one Specialist at founding (you have ${spec}).`])}
 if(cnt('daemon')){if(G.founding)I.push(['err','The Daemon cannot be recruited at gang creation.']);if(D().rep&&G.rep<D().rep)I.push(['err',`A ${D().n} Daemon needs ${D().rep} Rep.`]);if(!D().rep)I.push(['warn','Daemon Rep for Chaos Undivided is unclear in the book (“3D3 +125”) – agree it with your Arbitrator.'])}
 const brutes=fs.filter(f=>FT[f.type].brute).length,maxB=1+Math.floor(Math.max(0,G.rep)/5);if(brutes>maxB)I.push(['err',`Rep ${G.rep} allows ${maxB} Brute/Hanger-On; you have ${brutes}.`]);
 const seen={};fs.forEach(f=>(f.items||[]).forEach(n=>seen[n]=(seen[n]||0)+1));
 Object.entries(seen).forEach(([n,k])=>{const e=EQ[n];if(!e)return;if(e.lim&&k>e.lim)I.push(['err',`${n}: gang limit ${e.lim} (you have ${k}).`]);if(e.rep&&G.rep<e.rep)I.push(['warn',`${n} needs Rep ${e.rep}.`])});
 fs.forEach(f=>{const T=FT[f.type],nm=f.name||T.n;const m=(f.muts||[]).length,st=stats(f);
  if(G.founding&&(m<T.mut[0]||m>T.mut[1])&&(T.mut[1]||m))I.push(['err',`${nm}: ${T.mut[0]===T.mut[1]?'no':T.mut[0]+'–'+T.mut[1]} Mutations at recruitment (has ${m}).`]);
  if(m>st.T)I.push(['err',`${nm} has more Mutations than Toughness – they become a Chaos Spawn.`]);
  if(m===st.T&&m)I.push(['warn',`${nm} is one Mutation from becoming a Chaos Spawn.`]);
  if((f.items||[]).filter(n=>n==='Familiar').length>1)I.push(['err',`${nm}: max 1 Familiar per fighter.`]);
  if(f.type==='mutant'&&!f.spec&&(f.items||[]).some(n=>EQ[n]&&EQ[n].cat==='special'))I.push(['warn',`${nm}: only a Mutant Specialist can use Special Weapons.`]);
  if(f.type==='cultist'&&!f.spec&&(f.items||[]).some(n=>EQ[n]&&['special','heavy'].includes(EQ[n].cat)))I.push(['warn',`${nm}: only a Cultist Specialist can use Special and Heavy Weapons.`]);
  if(T.wyrd&&!(f.wyrd||[]).length)I.push(['warn',`${nm}: pick a free Wyrd Power.`]);
  if(T.free&&!f.skills)I.push(['warn',`${nm}: pick a free Primary skill.`]);
  if((f.muts||[]).includes('Crooked Body')&&(f.items||[]).some(n=>EQ[n]&&EQ[n].cat==='armour'))I.push(['warn',`${nm}: Crooked Body can't wear armour.`]);
  if(f.psyker&&f.type==='apostle'&&G.rep<10)I.push(['err',`Psyker Apostle needs 10 Rep.`]);
 });
 if(!I.length)I.push(['ok','Roster is legal.']);return I}

 if(d.dup){const f=byUid(d.dup);const c=JSON.parse(JSON.stringify(f));c.uid=uid();c.name=(f.name||FT[f.type].n)+' II';G.fighters.splice(G.fighters.indexOf(f)+1,0,c);commit();return}

 if(a==='example'){G=exampleGang();save();renderBuild()}
 if(a==='expand'||a==='collapse'){G.fighters.forEach(f=>f.open=a==='expand');save();renderBuild()}
 if(a==='copytext')copy(rosterText(),'Roster copied');

function copy(txt,msg,fallbackEl){try{navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>sel(fallbackEl))}catch(e){sel(fallbackEl)}
 function sel(el){if(el){el.focus();el.select();toast('Press Ctrl/Cmd+C to copy')}else{const ta=document.getElementById('io');if(ta){ta.value=txt;ta.closest('details').open=true;ta.focus();ta.select();toast('Selected – press Ctrl/Cmd+C')}}}}
function rosterText(){const L=[`${G.name} – Chaos Cult (${D().n}), ${PATHS[G.path].n}`,`${gangCost()} / ${G.budget} credits · Rep ${G.rep}`,''];
 G.fighters.forEach(f=>{const T=FT[f.type],s=stats(f);L.push(`${f.name||T.n} – ${T.n}${f.spec?' (Specialist)':''} – ${cost(f)} cr`);
  L.push('  '+STATK.map(k=>k+' '+fmt(k,s[k])).join(' | '));
  const w=weaponsOf(f).map(x=>x[0]);if(w.length)L.push('  Weapons: '+w.join(', '));const g=gearOf(f);if(g.length)L.push('  Wargear: '+g.join(', '));
  if(cstat(f)!=='active')L.push('  Status: '+CSTAT.find(x=>x[0]===cstat(f))[1]);if((f.injuries||[]).length)L.push('  Lasting Injuries: '+f.injuries.join(', '));if(+f.xp)L.push('  XP: '+f.xp);if(T.mark)L.push('  '+markName()+': '+markSummary(f));if((f.muts||[]).length)L.push('  Mutations: '+f.muts.join(', '));if(f.wyrd&&f.wyrd.length)L.push('  Wyrd Powers: '+f.wyrd.join(', '));if(f.skills)L.push('  Skills: '+f.skills);L.push('')});
 return L.join('\n')}

const STATUS=[['standing','Standing'],['pinned','Pinned'],['si','Seriously Injured'],['broken','Broken'],['ooa','Out of Action'],['out','Not in crew']];
const fsOf=f=>B.fs[f.uid]||(B.fs[f.uid]={st:cstat(f)==='active'?'standing':'out',fw:0,imp:false,eng:false});
function diceFor(f){const s=fsOf(f);if(f.type==='scrunt'||cstat(f)!=='active')return 0;if(['si','broken','ooa','out'].includes(s.st))return 0;let n=1;
 if(f.type==='chosen')n=2;if((f.items||[]).includes('Cult Icon'))n=Math.max(n,3);if(/hagiocracy/i.test(f.skills||''))n=Math.max(n,3);if(s.imp)n=Math.max(n,3);
 if(G.path==='vacillation'&&(FT[f.type].hier))n++;if(G.path==='destruction'&&s.eng)n++;return n}
function endPhaseInfo(){let n=0;const parts=[];G.fighters.forEach(f=>{const k=diceFor(f);if(k){n+=k}});parts.push(`${n} from fighters`);
 if(G.path==='destruction'&&B.enemyOOA){n+=B.enemyOOA;parts.push(`${B.enemyOOA} for enemies Out of Action`)}
 if(G.path==='perversion'&&B.enemyFW){n+=B.enemyFW;parts.push(`${B.enemyFW} for wounded enemies`)}
 if(G.path==='degeneration'){const k=G.fighters.filter(f=>['si','ooa'].includes(fsOf(f).st)).length;if(k){n+=k;parts.push(`${k} for your fallen`)}}
 let thr=5;if(G.path==='affliction'){const ld=G.fighters.find(f=>f.type==='apostle');if(B.bottled||(ld&&fsOf(ld).st==='ooa'))thr=4}
 return{n,thr,parts}}

function trackCard(f){const T=FT[f.type],s=fsOf(f),st=stats(f);const hurt={};if(s.fw)hurt.T=Math.max(0,st.T-s.fw);

   <span class="fw">FW <button class="step" data-fw="${f.uid}" data-d="-1" aria-label="Remove flesh wound">−</button><span class="num" style="font-weight:600">${s.fw}</span><button class="step" data-fw="${f.uid}" data-d="1" aria-label="Add flesh wound">+</button></span></div>
  <div class="row"><label class="check"><input type="checkbox" data-imp="${f.uid}" ${s.imp?'checked':''}> Impassioned</label>${G.path==='destruction'?`<label class="check"><input type="checkbox" data-eng="${f.uid}" ${s.eng?'checked':''}> Engaged</label>`:''}</div>
  <details class="rd"><summary>Rules & wargear</summary><div class="t stack">${ruleDetails(rules)}${g.map(n=>`<p style="font-size:.85rem"><strong>${esc(n)}:</strong> ${esc(EQD[n]||'')}</p>`).join('')}${(f.muts||[]).map(n=>`<p style="font-size:.85rem"><strong>${esc(n)}:</strong> ${esc(MUTS[n]?.t)}</p>`).join('')}${(f.skills||'').split(',').map(x=>x.trim()).filter(Boolean).map(n=>{const s=ALLSKILLS.find(z=>z[0].toLowerCase()===n.toLowerCase());return s?`<p style="font-size:.85rem"><strong>${esc(s[0])}:</strong> ${esc(s[1])}</p>`:''}).join('')}${(f.wyrd||[]).map(n=>{const w=WYRD.find(z=>z[0]===n);return w?`<p style="font-size:.85rem"><strong>${esc(w[0])} (${w[1]}):</strong> ${esc(w[2])}</p>`:''}).join('')}</div></details>

 const mod=(R.won?1:0)+(R.gain?1:0)+(R.bleed?1:0)+(ritMatch()?1:0)-(R.lost?1:0)-(R.rec?1:0);
 return `<section class="panel stack" aria-label="Dark Ritual">
  <div class="row" style="justify-content:space-between"><h3>${FV.r}</h3><span class="pill brass">Dark Ritual pre-battle action</span></div>
  <p class="muted" style="font-size:.9rem">Before crews are chosen. Roll 2D6 plus modifiers: 9+ wins the favour of ${esc(FV.god)} for one battle; 4 or less turns the ritual's focus into a Chaos Spawn.</p>
  ${und?`<div class="field"><label class="label" for="rit-fav">Chaos Undivided may petition any power</label><select id="rit-fav">${Object.entries(FAV).map(([k2,F2])=>`<option value="${k2}" ${ritFav()===k2?'selected':''}>${F2.god} – ${F2.r}</option>`).join('')}</select></div>`:''}
  <div class="grid2">
   <label class="check"><input type="checkbox" data-rit="won" ${R.won?'checked':''}> Won last battle (+1)</label>
   <label class="check"><input type="checkbox" data-rit="gain" ${R.gain?'checked':''}> Gained Rep last battle (+1)</label>
   <label class="check"><input type="checkbox" data-rit="bleed" ${R.bleed?'checked':''}> Bleed a Captive (+1)</label>
   ${und?`<label class="check"><input type="checkbox" data-rit="match" ${R.match?'checked':''}> Ritual matches dedication (+1) – agree with your Arbitrator</label>`:`<label class="check"><input type="checkbox" checked disabled> Ritual matches dedication (+1)</label>`}
   <label class="check"><input type="checkbox" data-rit="lost" ${R.lost?'checked':''}> Lost Rep last battle (−1)</label>
   <label class="check"><input type="checkbox" data-rit="rec" ${R.rec?'checked':''}> Leader in Recovery (−1)</label>
  </div>
  <div class="field"><label class="label" for="rit-def">Defilement (optional): fighter starts with D3 Flesh Wounds, +1 per wound</label><select id="rit-def"><option value="">No Defilement</option>${G.fighters.map(f=>`<option value="${f.uid}" ${R.defile===f.uid?'selected':''}>${esc(f.name||FT[f.type].n)}</option>`).join('')}</select></div>
  <div class="row"><button class="btn primary" data-b="ritual" ${nonLeaders.length?'':'disabled'}>Enact the ritual</button><span class="muted">Fixed modifier ${mod>=0?'+':''}${mod}</span></div>
  ${B.ritRes?ritResult(B.ritRes):''}
  ${R.bleed?`<p class="muted" style="font-size:.85rem">Bleed the Captive: the captive rolls a Lasting Injury of 50+D6 and is deployed within 12" of the table centre. An enemy within 1" can Free Captive (Simple); pass Intelligence to capture them, fail and they return with Humiliated.</p>`:''}
 </section>
 <section class="panel stack" aria-label="Sub-plots">
  <div class="row" style="justify-content:space-between"><h3>Sub-plot deck</h3><span class="muted num" style="font-size:.88rem">${54-DK.removed.length-DK.hand.length} cards left · ${DK.removed.length} completed</span></div>
  <p class="muted" style="font-size:.9rem">Draw in secret. Tap a card to reveal its text. Completed cards leave the deck for the rest of the campaign.</p>
  <div class="row"><button class="btn primary" data-b="draw">Draw a sub-plot</button><button class="btn" data-b="returnall" ${DK.hand.length?'':'disabled'}>Return hand to deck</button>${DK.confirm?`<span class="confirm">Restore every completed card? <button class="btn small danger" data-b="reshuffle-yes">Restore</button><button class="btn small" data-b="reshuffle-no">Keep</button></span>`:`<button class="btn ghost" data-b="reshuffle">Rebuild full deck</button>`}</div>
  ${DK.note?`<p class="pill blood">${esc(DK.note)}</p>`:''}
  <div class="grid2">${DK.hand.map(id=>{const [s,r]=id.split('-');const S=SP[s],c=S.c[RANKS.indexOf(r)];const shown=(DK.shown||[]).includes(id);
   return `<div class="card-back"><div class="row" style="justify-content:space-between"><span class="suit">${r}${S.sym}</span><span class="pill">${S.theme} · ${S.reward}</span></div>
   ${shown?`<strong>${esc(c[0])}</strong><p style="font-size:.88rem">${esc(c[1])}</p>`:`<button class="btn small" data-reveal="${id}">Reveal</button>`}
   <div class="row"><button class="btn small" data-done="${id}">Completed</button><button class="btn small ghost" data-back="${id}">Return to deck</button></div></div>`}).join('')}</div>
 </section>`}
function ritResult(r){return `<div class="result ${r.total>=9?'pass':r.total<=4?'fail':''}"><div class="dice">${r.dice.map(v=>`<span class="die hit">${v}</span>`).join('')}${r.def?`<span class="pill">Defilement +${r.def}</span>`:''}</div>
 <p><strong>${r.total}</strong> – focus: <strong>${esc(r.focus)}</strong>${r.defName?` · ${esc(r.defName)} starts with ${r.def} Flesh Wound${r.def>1?'s':''}`:''}</p>
 ${r.total>=9?(()=>{const FV=FAV[r.fav]||FAV.khorne;return `<p><strong>The favour of ${esc(FV.god)}</strong> for this battle (mark it on the roster). ${esc(r.focus)} gains ${r.xp} XP.</p><ul style="margin:0;padding-left:1.2em"><li><strong>Blessing:</strong> ${esc(FV.b[0])}</li><li><strong>Boon:</strong> ${esc(FV.b[1])}</li><li><strong>Warped:</strong> ${esc(FV.b[2])}</li></ul>`})():r.total<=4?`<p><strong>Unworthy.</strong> ${esc(r.focus)} is transformed into a Chaos Spawn.</p>`:`<p>No favour this time; nothing else happens.</p>`}</div>`}

function playSheet(){const sec=(t,b,open)=>`<details class="rd" ${open?'open':''}><summary style="font-size:1rem">${t}</summary><div class="t stack">${b}</div></details>`;
 const list=a=>`<ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px">${a.map(x=>`<li><strong>${esc(x[0])}${x[1]&&x.length>2?' ('+esc(x[1])+')':''}:</strong> ${esc(x[x.length-1])}</li>`).join('')}</ul>`;
 return `<div class="stack">
 ${sec('Gang rules in play',list([['Limited Supply','Every ranged weapon a Chaos Cult fighter uses has the Scarce trait.'],['Infernal Pacts','On activation, a fighter with Blaze and/or Insane may remove them, then suffers D2 Flesh Wounds at the end of the activation.'],[markName(),'Leader, Champions and the Daemon. '+markText()],['Devotion','Friendly fighters within 6" and line of sight of the Apostle may use their Cool and Willpower.'],['Group Activation','Apostle (2), Disciple (1), Cult Icon +1. One Group Activation per gang per turn. The Ogryn is Slow-Witted.'],['Bottle tests','Apostle passing Cool: all friends within 12" pass. Champions: 6". Mutant Lord: only Mutants within 6".']]),true)}
 ${sec('Delusion Dice and Articles',list([['Generate','End Phase: D6 per fighter not Seriously Injured or Broken; 5+ adds a die. Chosen roll 2, Cult Icon/Hagiocracy/Impassioned roll 3.'],['Beseech the Gods (Double)','The fighter becomes Impassioned and rolls three D6 in the End Phase.'],['Invoke','Declare at the start of an activation, commit dice, total ≥ Threshold to pass. Dice are discarded either way.'],[D().n,xpRule()],['Limit','A passed Article can’t be invoked again this round.'],['Path benefit',PATHS[G.path].benefit]]),true)}
 ${sec('Lasting Injuries (D66)',`<div class="scroll"><table class="dt"><tbody>${LI.map(x=>`<tr><td class="c">${x.r}</td><td><strong>${x.n}</strong></td><td>${esc(x.t)}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:.85rem">Amaranthine: if the Apostle suffers a Memorable Death, a random fighter dies instead and the Apostle takes Enfeebled and Crooked Body. The Daemon ignores everything except Memorable Death.</p>`)}
 ${sec('Heresy skills',list(HERESY))}
 ${sec(`${D().god} skills (${D().n})`,list(GODSKILL[D().god]))}
 ${sec('Wyrd Powers (Aetheric)',list(WYRD))}
 ${sec('Mutations',list(MUTL.map(m=>[m[1],m[3]])))}
 ${sec('Chaos Spawn',`<p>M D3+3". Roll a D6 per X on creation: 1 – WS4+ S3 T4 W1 I5+ A1 (32mm); 2–5 – WS4+ S4 T5 W2 I4+ A2 (40/50mm); 6 – WS3+ S5 T6 W3 I3+ A3 (60mm).</p><p>Only Move, Charge, Fight and Coup de Grace. Never Pinned or Broken, immune to Insane, auto-passes Cool and Willpower. Flesh Wound counts as No Effect, Serious Injury as Flesh Wound. After battle, restrain with 0–3 Gangers/Juves: any 4+ succeeds; a 1 means that fighter takes a Lasting Injury.</p>`)}
 ${sec('Familiar & Daemon',`<p><strong>Familiar:</strong> ${esc(EQD.Familiar)} ${esc(RULES['Omen of Fortune'])} ${esc(RULES['Precognition'])}</p><p><strong>Daemon:</strong> summoned only by “Call the Void” (12+). ${esc(RULES.Terrifying)} ${esc(RULES.Incorporeal)} ${esc(RULES.Instability)}</p>`)}
 </div>`}

app.addEventListener('click',e=>{if(!document.querySelector('[data-ptab]'))return;const el=e.target.closest('button');if(!el)return;const d=el.dataset;
 if(d.ptab){UI.play=d.ptab;saveUI();renderPlay();return}
 if(d.pli){const f=byUid(d.pli);lastLI[f.uid]=rollLI(f);save();renderPlay();toast(`${lastLI[f.uid].v}: ${lastLI[f.uid].r.n}`);return}
 if(d.fw){const f=byUid(d.fw),s=fsOf(f);s.fw=Math.max(0,s.fw+(+d.d));if(s.fw>=stats(f).T&&s.st!=='ooa'){s.st='ooa';toast(`${f.name||FT[f.type].n} goes Out of Action`)}saveB();renderPlay();return}
 if(d.reveal){DK.shown=DK.shown||[];DK.shown.push(d.reveal);saveD();renderPlay();return}
 if(d.done){DK.hand=DK.hand.filter(x=>x!==d.done);DK.removed.push(d.done);DK.note='';saveD();renderPlay();return}
 if(d.back){DK.hand=DK.hand.filter(x=>x!==d.back);saveD();renderPlay();return}
 const b=d.b;if(!b)return;const arts=pathArts(G.path);
 if(b==='round+'){B.round++}if(b==='round-'){B.round=Math.max(1,B.round-1)}
 if(b==='pool+'){B.pool++}if(b==='pool-'){B.pool=Math.max(0,B.pool-1)}
 if(b==='n+'){B.useN=Math.min(B.pool,(B.useN||2)+1)}if(b==='n-'){B.useN=Math.max(1,(Math.min(B.useN||2,B.pool))-1)}
 if(b==='endphase'){const ep=endPhaseInfo();const dice=Array.from({length:ep.n},d6);const gain=dice.filter(v=>v>=ep.thr).length;B.pool+=gain;G.fighters.forEach(f=>fsOf(f).imp=false);B.last={kind:'end',dice,thr:ep.thr,gain}}
 if(b==='nextround'){B.round++;B.used={};B.last=null;toast(`Round ${B.round}`)}
 if(b==='reset'){playConfirm=true;renderPlay();return}
 if(b==='reset-no'){playConfirm=false;renderPlay();return}
 if(b==='reset-yes'){playConfirm=false;B={round:1,pool:0,used:{},fs:{},enemyOOA:0,enemyFW:0,bottled:false,last:null,art:B.art}}
 if(b==='invoke'){const A=arts.find(a=>a.id===(B.art&&arts.find(x=>x.id===B.art)?B.art:arts[0].id));const n=Math.min(B.useN||2,B.pool);if(!A||!n)return;
  const dice=Array.from({length:n},d6),total=dice.reduce((s,v)=>s+v,0),pass=total>=A.t;B.pool-=n;if(pass)B.used[A.id]=true;B.last={kind:'art',dice,total,t:A.t,pass,passT:A.pass,failT:A.fail}}
 if(b==='ritual'){const R=B.rit||{};const pool=G.fighters.filter(f=>f.type!=='apostle');const focus=G.fighters.find(f=>f.type==='scrunt')||pool[Math.floor(Math.random()*pool.length)];
  const dice=[d6(),d6()];let def=0,defName='';if(R.defile){const df=byUid(R.defile);if(df){def=1+Math.floor(Math.random()*3);defName=df.name||FT[df.type].n;const s=fsOf(df);s.fw=def;s.st='standing'}}
  const total=dice[0]+dice[1]+(R.won?1:0)+(R.gain?1:0)+(R.bleed?1:0)+(ritMatch()?1:0)-(R.lost?1:0)-(R.rec?1:0)+def;
  B.ritRes={fav:ritFav(),dice,def,defName,total,focus:focus?(focus.name||FT[focus.type].n):'–',xp:d6()}}
 if(b==='draw'){DK.note='';draw(1)}
 if(b==='returnall'){DK.hand=[];DK.note=''}
 if(b==='reshuffle'){DK.confirm=true}if(b==='reshuffle-no'){DK.confirm=false}if(b==='reshuffle-yes'){DK={removed:[],hand:[],note:'',shown:[]}}
 saveB();saveD();renderPlay()});
function draw(n){const all=[];Object.keys(SP).forEach(s=>RANKS.forEach(r=>all.push(s+'-'+r)));all.push('JK-1','JK-2');
 for(let i=0;i<n;i++){const avail=all.filter(c=>!DK.removed.includes(c)&&!DK.hand.includes(c)&&!(DK.jok||[]).includes(c));if(!avail.length){DK.note='The deck is empty.';return}
  const c=avail[Math.floor(Math.random()*avail.length)];if(c.startsWith('JK')){DK.jok=(DK.jok||[]).concat(c);DK.note='Joker! Show it to your opponent and discard it. Drawing two more…';draw(2);DK.jok=[];continue}DK.hand.push(c)}}
app.addEventListener('toggle',e=>{if(e.target.id==='arts-all'){UI.artsOpen=e.target.open;saveUI()}},true);
app.addEventListener('change',e=>{if(!document.querySelector('[data-ptab]'))return;const t=e.target,d=t.dataset;

 if(t.id==='b-eooa'){B.enemyOOA=Math.max(0,+t.value||0)}
 if(t.id==='b-efw'){B.enemyFW=Math.max(0,+t.value||0)}
 if(t.id==='b-bot'){B.bottled=t.checked}
 if(d.rit){B.rit=B.rit||{};B.rit[d.rit]=t.checked}
 if(t.id==='rit-def'){B.rit=B.rit||{};B.rit.defile=t.value}
 if(t.id==='rit-fav'){B.rit=B.rit||{};B.rit.fav=t.value}
 if(t.id==='rules-q')return;
 saveB();if(document.querySelector('[data-ptab]'))renderPlay()});

function pickReason(f,E){const T=FT[f.type],k=itemCount(E.n);
 if(E.lim&&k>=E.lim)return `Gang limit reached (${k}/${E.lim})`;
 if(E.rep&&G.rep<E.rep)return `Needs Rep ${E.rep} (gang has ${G.rep})`;
 if(E.n==='Familiar'&&(f.items||[]).includes('Familiar'))return 'One Familiar per fighter';
 if(E.n==='Cult Icon'&&k>=1)return 'One Cult Icon per gang';
 return ''}
function pickWarn(f,E){if(f.type==='mutant'&&!f.spec&&E.cat==='special')return 'Only a Mutant Specialist can use this';
 if(f.type==='cultist'&&!f.spec&&['special','heavy'].includes(E.cat))return 'Only a Cultist Specialist can use this';
 if(E.cat==='armour'&&(f.muts||[]).includes('Crooked Body'))return 'Crooked Body: can’t wear armour';return ''}
function renderPick(){const f=byUid(UI.pick.uid),T=FT[f.type],kind=UI.pick.kind,nm=f.name||T.n,q=(UI.pickQ||'').trim().toLowerCase();const st=stats(f);
 const have=kind==='equip'?(f.items||[]):kind==='skill'?skillsOf(f):(f.muts||[]);
 let body='';
 if(kind==='equip'){const cats=CATS.filter(([c])=>EQL.some(e=>e[2]===c&&e[3].includes(T.code)));const cur=cats.some(c=>c[0]===UI.pickCat)?UI.pickCat:'all';
  let list=EQL.filter(e=>e[3].includes(T.code)&&(cur==='all'||e[2]===cur)).map(e=>EQ[e[0]]).filter(E=>!q||(E.n+' '+(EQD[E.n]||'')+' '+E.p.map(n=>WP[n]?WP[n][8]:'').join(' ')).toLowerCase().includes(q));
  const repHidden=UI.hideRep?list.filter(E=>E.rep&&G.rep<E.rep).length:0;if(UI.hideRep)list=list.filter(E=>!(E.rep&&G.rep<E.rep));
  body=`<div class="seg" role="group" aria-label="Category"><button data-pcat="all" aria-pressed="${cur==='all'}">All</button>${cats.map(([c,l])=>`<button data-pcat="${c}" aria-pressed="${cur===c}">${l.replace(' weapons','').replace(' equipment','')}</button>`).join('')}</div>
  <div class="row"><button class="btn small ${UI.hideRep?'primary':''}" data-hiderep aria-pressed="${!!UI.hideRep}">${UI.hideRep?'✓ ':''}Hide items above Rep ${G.rep}</button>${UI.hideRep&&repHidden?`<span class="muted" style="font-size:.85rem">${repHidden} hidden</span>`:''}</div>
  <div class="pgrid">${list.map(E=>{const why=pickReason(f,E),warn=pickWarn(f,E),own=have.filter(x=>x===E.n).length,used=itemCount(E.n);
   return `<article class="pc ${why?'off':''}"><div class="pch"><h3>${esc(E.n)}</h3><span class="big" style="font-size:1.1rem">${E.c}<small class="muted"> cr</small></span></div>
   <div class="row">${E.lim?`<span class="pill">Gang 0-${E.lim} · ${used} taken</span>`:''}${E.rep?`<span class="pill ${G.rep<E.rep?'blood':''}">Rep ${E.rep}</span>`:''}${own?`<span class="pill brass">Carrying ${own}</span>`:''}${warn?`<span class="pill blood">${esc(warn)}</span>`:''}</div>
   ${E.p.length?wtable(E.p.map(n=>[n,WP[n]])):''}${EQD[E.n]?`<p style="font-size:.9rem">${esc(EQD[E.n])}</p>`:''}
   <div class="row" style="margin-top:auto"><button class="btn primary" data-padd="${esc(E.n)}" ${why?'disabled':''}>Add to ${esc(nm)}</button>${own?`<button class="btn" data-prm="${esc(E.n)}">Remove one</button>`:''}${why?`<span class="muted" style="font-size:.85rem">${esc(why)}</span>`:''}</div></article>`}).join('')||'<p class="muted">Nothing matches.</p>'}</div>`}
 else if(kind==='skill'){const AC=access(f.type);const acc=n=>AC.P.includes(n)?'P':AC.S.includes(n)?'S':'';
  const cur=UI.pickCat==='all'?'all':'mine';
  const order=[...skillSets().filter(([n])=>acc(n)==='P'),...skillSets().filter(([n])=>acc(n)==='S'),...(cur==='all'?skillSets().filter(([n])=>!acc(n)):[])];
  const groups=order.map(([set,L])=>[set,L.filter(h=>!q||(h[0]+' '+h[1]+' '+set).toLowerCase().includes(q))]).filter(([,L])=>L.length);
  body=`<div class="seg" role="group" aria-label="Skill sets"><button data-pcat="mine" aria-pressed="${cur==='mine'}">This fighter’s sets</button><button data-pcat="all" aria-pressed="${cur==='all'}">All skill sets</button></div>
  ${T.free?`<p class="muted" style="font-size:.88rem">Recruits with one free skill from a Primary set.</p>`:''}
  ${groups.map(([set,L])=>{const a=acc(set);return `<section class="stack" aria-label="${esc(set)} skills" style="gap:8px"><div class="row"><h3 style="margin:0">${esc(set)}</h3>${a==='P'?'<span class="pill brass">Primary</span>':a==='S'?'<span class="pill">Secondary</span>':'<span class="pill blood">Not on this fighter’s list</span>'}</div>
  <div class="pgrid">${L.map(h=>{const own=have.includes(h[0]);return `<article class="pc ${a?'':'off'}"><div class="pch"><h3>${esc(h[0])}</h3></div>
   ${own?'<div class="row"><span class="pill brass">Has this</span></div>':''}
   <p style="font-size:.92rem">${esc(h[1])}</p>
   <div class="row" style="margin-top:auto">${own?`<button class="btn" data-prm="${esc(h[0])}">Remove</button>`:`<button class="btn primary" data-padd="${esc(h[0])}">Add to ${esc(nm)}</button>`}</div></article>`}).join('')}</div></section>`}).join('')||'<p class="muted">Nothing matches.</p>'}
  <p class="muted" style="font-size:.82rem">Core skill text is a short summary – check the Necromunda rulebook for exact wording.</p>`}
 else{const list=MUTL.filter(m=>!q||(m[1]+' '+m[3]).toLowerCase().includes(q));const n=have.length;
  body=`<p class="muted">${n} Mutation${n===1?'':'s'} against Toughness ${st.T}. More Mutations than Toughness turns the fighter into a Chaos Spawn.${G.founding&&T.mut[1]?` At recruitment this fighter takes ${T.mut[0]}–${T.mut[1]}.`:''}</p>
  <div class="pgrid">${list.map(m=>{const own=have.includes(m[1]);const danger=!own&&n+1>st.T;
   return `<article class="pc"><div class="pch"><h3>${esc(m[1])}</h3><span class="big" style="font-size:1.1rem">${m[2]}<small class="muted"> cr</small></span></div>
   <div class="row"><span class="pill">D66 ${m[0]}</span>${own?'<span class="pill brass">Has this</span>':''}${danger?'<span class="pill blood">Would turn them into a Spawn</span>':''}</div>
   <p style="font-size:.92rem">${esc(m[3])}</p>
   <div class="row" style="margin-top:auto">${own?`<button class="btn" data-prm="${esc(m[1])}">Remove</button>`:`<button class="btn primary" data-padd="${esc(m[1])}">Add to ${esc(nm)}</button>`}</div></article>`}).join('')||'<p class="muted">Nothing matches.</p>'}</div>`}
 app.innerHTML=`<div class="picker stack" style="gap:16px">

  ${kind==='equip'?`<p class="muted" style="font-size:.85rem">${esc(T.equip)} All ranged weapons count as Scarce.</p>`:''}</div>
  <input type="search" class="search" id="pick-q" placeholder="${kind==='equip'?'Search – e.g. chain, Blast, Rending':kind==='skill'?'Search – e.g. Pinned, charge, Cool':'Search – e.g. Wounds, armour'}" value="${esc(UI.pickQ||'')}" aria-label="Search">

app.addEventListener('click',e=>{if(!document.querySelector('.picker'))return;const el=e.target.closest('button');if(!el)return;const d=el.dataset;const f=byUid(UI.pick.uid);const key=UI.pick.kind==='equip'?'items':'muts';
 if(d.pcat){UI.pickCat=d.pcat;saveUI();renderPick();return}
 if('hiderep' in d){UI.hideRep=!UI.hideRep;saveUI();renderPick();return}
 if(UI.pick.kind==='skill'&&(d.padd||d.prm)){const a=skillsOf(f);if(d.padd&&!a.includes(d.padd))a.push(d.padd);if(d.prm){const i=a.indexOf(d.prm);if(i>-1)a.splice(i,1)}setSkills(f,a);G.example=false;save();renderPick();if(d.padd)toast(`${d.padd} added`);return}
 if(d.padd){f[key]=(f[key]||[]).concat(d.padd);G.example=false;save();renderPick();toast(`${d.padd} added`);return}
 if(d.prm){const i=(f[key]||[]).lastIndexOf(d.prm);if(i>-1)f[key].splice(i,1);save();renderPick();return}
 if(d.act==='pickdone'){G.fighters.forEach(x=>x.open=x.uid===f.uid);save();UI.scrollTo=f.uid;saveUI();location.hash='#build'}});
app.addEventListener('input',e=>{if(e.target.id!=='pick-q')return;UI.pickQ=e.target.value;saveUI();const pos=e.target.selectionStart;renderPick();const n=document.getElementById('pick-q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}});

/* ============================== RULES ============================== */
function rulesSections(){const tbl=(heads,rows,cls='')=>`<div class="scroll"><table class="dt ${cls}"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
 const rb=(t,body,wide)=>`<div class="rb ${wide?'wide':''}">${t?`<h3>${t}</h3>`:''}${body}</div>`;
 const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 const S=[];
 S.push(['gang','Gang rules',[
  rb('Founding the gang',ul(['Recruit only 2 Champions at the start. Leaders and Champions may never outnumber fighters with the Gang Fighter (X) rule (Gangers, Prospects, Juves).',`The gang is dedicated to ${D().title} and chooses a Path of Damnation. Change the dedication on the Gang page to see another god’s rules.`,'A fighter with more Mutations than their Toughness turns into a Chaos Spawn.','Some items are limited across the gang (0-X) or need Reputation (X) before they can be bought.'])),
  rb('Chaos Cult rules',ul(['<strong>Limited Supply:</strong> every ranged weapon a Chaos Cult fighter uses counts as Scarce. Restricted items can’t be bought until their limits and Rep are met.','<strong>Outcast:</strong> Trading Post Rarity +2 on everything, plus a 25% handling charge on the total.','<strong>Ostracised:</strong> restricted Brutes and Hangers-On. Always Outlaw; can’t change Alignment.','<strong>Infernal Pacts:</strong> on activation, a fighter with Blaze and/or Insane may remove them, then suffers D2 Flesh Wounds at the end of the activation.','<strong>Vows of the Void:</strong> choose an Unholy Dedication and then a Path of Damnation at founding.'])),
  rb('Brutes and Hangers-On',`<p>Total allowed by Reputation: 0–5 Rep: 1 · 5–9: 2 · 10–14: 3 · 15–19: 4 · 20–24: 5 · +1 per further 5 Rep.</p>`+ul(['<strong>Brutes:</strong> Corrupted Ogryn, Daemon, Iron Automata, Awakened Ogryn, Outlands Beastmaster, Sump Beast.','<strong>Hangers-On:</strong> Agitator, Cadaver Merchant, Chem Dealer, Heretek (no starting weapons or armour; Cultist Specialist equipment access), Propagandist, Rogue Doc, Scabber.','The book also says they “may never use Articles of Damnation” – most likely meaning hired Brutes and Hangers-On can’t invoke Articles.'])),
 ]]);
 S.push(['fighters','Fighters',ORDERF().map(t=>{const T=FT[t],b=baseStats(t),k=stats({type:t,muts:[]});const rules=T.rules.slice();if(T.mark)rules.push(markName());
  return rb(`${T.n} <span class="pill">${T.role} · ${T.cost} cr${T.max<99?' · 0-'+T.max:''}</span>`,`${statTable(b)}${T.mark?`<p class="label">With ${esc(markName())}${D().key==='undivided'?' (Vicious shown)':''}</p>${statTable(k,b)}`:''}<p style="font-size:.9rem">${esc(T.equip)}</p><p style="font-size:.9rem"><strong>Primary:</strong> ${access(t).P.join(', ')||'–'} · <strong>Secondary:</strong> ${access(t).S.join(', ')||'–'}</p>${t==='daemon'?wtable([['Vorpal Claws',WP['Vorpal Claws']],['Warpfire Breath',WP['Warpfire Breath']]]):''}${t==='ogryn'?wtable(['Open Fist','Power Maul','Horrific Appendages'].map(n=>[n,WP[n]])):''}<div class="stack" style="gap:4px">${rules.map(n=>`<p style="font-size:.9rem"><strong>${esc(n)}:</strong> ${esc(RULES[n])}</p>`).join('')}</div>`)}).concat([
  rb('Familiar <span class="pill">Exotic Beast · 65 cr on the lists · 0-3</span>',`<p style="font-size:.9rem">${esc(EQD.Familiar)} Max 1 per fighter. No equipment, unarmed attacks only.</p>${['Clamber','Omen of Fortune','Precognition'].map(n=>`<p style="font-size:.9rem"><strong>${n}:</strong> ${esc(RULES[n])}</p>`).join('')}`),
  rb('Chaos Spawn <span class="pill">Unique</span>',`<p style="font-size:.9rem">Gained only when a fighter transforms. Free; adds 130 to Gang Rating. M D3+3". Roll a D6 per X: 1 – WS4+ S3 T4 W1 I5+ A1 (32mm); 2–5 – WS4+ S4 T5 W2 I4+ A2 (40/50mm); 6 – WS3+ S5 T6 W3 I3+ A3 (60mm).</p>`+ul(['<strong>Lost and Damned:</strong> the old fighter is removed; weapons go to the Stash, equipment is lost. The Spawn sits outside the gang structure.','<strong>Mindless Beast:</strong> only Move, Charge, Fight and Coup de Grace.','<strong>Warped Monstrosity:</strong> never Pinned or Broken, immune to Insane, auto-passes Cool and Willpower, auto-fails Leadership and Intelligence. Flesh Wound = No Effect, Serious Injury = Flesh Wound. Only Memorable Death as Lasting Injury.','<strong>Restraining the Spawn:</strong> after a battle, nominate 0–3 Gangers or Juves who weren’t OOA or SI; roll a D6 each. Any 4+ restrains it, otherwise it escapes. A 1 gives that fighter a Lasting Injury.'])),
 ])]);
 S.push(['equipment','Equipment lists',[rb('',`<p class="muted" style="font-size:.88rem">✓ = on that fighter's list. 0-X = gang limit. Rep = Reputation needed.</p>`+tbl(['Item','Cost','Limit','Rep',...WHO.map(w=>w[1])],CATS.flatMap(([cat,lab])=>[`<tr class="grp"><td colspan="${4+WHO.length}">${lab}</td></tr>`,...EQL.filter(e=>e[2]===cat).map(e=>{const E=EQ[e[0]];return `<tr><td>${esc(E.n)}</td><td class="c">${E.c}</td><td class="c">${E.lim?'0-'+E.lim:''}</td><td class="c">${E.rep||''}</td>${WHO.map(w=>`<td class="c">${E.who.includes(w[0])?'<span class="tick">✓</span>':''}</td>`).join('')}</tr>`})])),true)]]);
 S.push(['armoury','Armoury',WPG.map(([lab,names])=>rb(lab,tbl(['Weapon','Rng S','Rng L','Acc S','Acc L','Str','AP','D','Am','Traits'],names.map(n=>`<tr><td><strong>${esc(n)}</strong></td>${WP[n].slice(0,8).map(v=>`<td class="c">${esc(v)}</td>`).join('')}<td>${esc(WP[n][8])}</td></tr>`)),true)).concat([
  rb('Armour',ul(['Flak Armour','Gutterforged Cloak','Mesh Armour','Plate Mail','Scrap Shield','Boarding Shield','Mantle Malifica','Ablative Overlay','Refractor Field'].map(n=>`<strong>${n}:</strong> ${esc(EQD[n])}`).concat(['<strong>Light Carapace Armour:</strong> 4+ save.']))),
  rb('Equipment',ul(['Cult Icon','Drop Rig','Filter Plugs','Photo-Goggles','Respirator','Skinblade','Strip Kit','Cred Sniffer','Armoured Undersuit','Exotic Furs','Opulent Jewellery','Uphive Raiments','Forged Guilder Seal','Hexagrammatic Fetish','Data Thief','Mono-Sight'].map(n=>`<strong>${n}:</strong> ${esc(EQD[n])}`).concat(['<strong>Book of Desecration:</strong> Words of Chaos (Basic) – until the next End Phase, friendly Chaos Cult fighters within 6" at the start of their activation may re-roll the D3 for a Charge, or one natural 1 to hit.']))),
 ])]);
 S.push(['mutations','Mutations',[rb('',`<p style="font-size:.9rem">Bought at recruitment where the profile allows, or gained through the Mutation skill set (with XP; one free when added to the roster).</p>`+tbl(['D66','Mutation','Effect','Cr'],MUTL.map(m=>`<tr><td class="c">${m[0]}</td><td><strong>${m[1]}</strong></td><td>${esc(m[3])}</td><td class="c">${m[2]}</td></tr>`)),true)]]);
 S.push(['wyrd','Wyrd Powers',[rb('Aetheric Discipline',ul(['<strong>Sorcerer:</strong> access from recruitment; first power free, +30 each extra at recruitment.','<strong>Apostle:</strong> Psyker upgrade for 30 credits at 10 Rep – random power and Unsanctioned Psyker.','<strong>Daemon:</strong> Psyker upgrade for 30 credits at recruitment – random power and Unsanctioned Psyker.','Advancement: random power 9 XP, chosen power 12 XP. No limit.'])+tbl(['D6','Power','Type','Effect'],WYRD.map((w,i)=>`<tr><td class="c">${i+1}</td><td><strong>${w[0]}</strong></td><td>${w[1]}</td><td>${esc(w[2])}</td></tr>`)),true)]]);
 S.push(['skills','Skills',[rb(`Skill access – ${D().title}`,tbl(['Fighter',...['Agi','Bra','Com','Cun','Fer','Lea','Sho','Sav',D().god.slice(0,3),'Her','Mut']],SKT[D().key].map(([n,r])=>`<tr><td><strong>${n}</strong></td>${r.map(v=>`<td class="c">${v==='P'?'<span class="tick">P</span>':v}</td>`).join('')}</tr>`))+`<p class="muted" style="font-size:.85rem">${skillCols().join(', ')}. P = Primary, S = Secondary.</p>`,true),
  ...skillSets().map(([set,L])=>rb(set,`<ol>${L.map(h=>`<li><strong>${h[0]}:</strong> ${esc(h[1])}</li>`).join('')}</ol>${COREKEYS.includes(set)?'<p class="muted" style="font-size:.82rem">Short summary – check the Necromunda rulebook for exact wording.</p>':''}`))]]);
 S.push(['dedication','Dedication & Mark',[rb(esc(D().title),`<p class="muted" style="font-size:.9rem">Also known as ${esc(D().aka)}.</p>`+ul([`The Gang Leader and Champions gain the ${esc(markName())} (so does the Daemon).`,D().key==='undivided'?'Rituals may seek the favour of any Chaos power, including the Hierarch of Anarchy and Terror.':`Rituals may seek the favour of ${esc(D().title)}.`,esc(xpRule()),`The Daemon becomes available once the gang reaches the dedication’s Rep: ${esc(daemonRepText())}.`,'The dedication can’t change without the Arbitrator’s permission.'].concat(D().key==='undivided'?['A Chaos Undivided gang may dedicate itself to one Chaos God as a Post-Battle Action.']:[]))),
  rb(`The ${esc(markName())}`,D().key==='undivided'?ul(Object.values(UNDIV).map(u=>`<strong>${u.n}:</strong> ${u.t}.`).concat(['Each Leader and Champion picks one trait; the Daemon copies the Leader’s.'])):ul(D().traits.map(t=>`<strong>${t[0]}:</strong> ${esc(t[1])}.`).concat(['<strong>Hatred (X):</strong> must re-roll failed wound rolls in melee against fighters they hate.']))),
  rb('Daemon Rep by dedication',ul(DEDKEYS.map(k=>`<strong>${DED[k].n}:</strong> ${DED[k].rep?DED[k].rep+' Rep':'3D3 +125 (as written)'}`)))]]);
 S.push(['articles','Articles of Damnation',[rb('How they work',ul(['The Leader picks a Path at founding. It is permanent unless the Leader is replaced.','End Phase: D6 for every friendly fighter not Seriously Injured or Broken; each 5+ adds a Delusion Die. The pool carries over between rounds.','Beseech the Gods of Chaos (Double): the fighter becomes Impassioned and rolls three D6 in the End Phase.','Invoke at the start of an activation (no action, needs at least one die): commit dice, roll, total ≥ Threshold passes. Dice are discarded either way.','An Article affects only the invoking fighter until the start of their next activation, unless stated.','Any number of attempts, but a passed Article can’t be invoked again that round.'])),
  ...PATHKEYS.map(k=>{const P=PATHS[k];return rb(P.n,`<p class="muted" style="font-size:.9rem">${esc(P.blurb)}</p><p style="font-size:.9rem"><strong>Gang benefit:</strong> ${esc(P.benefit)}</p><div class="arts">${pathArts(k).map(a=>`<div class="art"><h4>(${a.num}) “${esc(a.n)}” <span class="thr">${a.t}+</span></h4><p>${esc(a.pass)}</p><p class="f">Fail: ${esc(a.fail)}</p></div>`).join('')}</div>`,true)})]]);
 S.push(['rituals','Dark Ritual',[rb('Dark Ritual pre-battle action',`<ol><li>Before crews are chosen, seek the favour of ${D().key==='undivided'?'any Chaos power':esc(D().title)}.</li><li>Randomly pick one gang member (not the Leader) as the focus. You may Bleed the Captive and/or Defile a fighter.</li><li>Roll 2D6: +1 won last battle, +1 gained Rep, +1 Captive bled, +1 matching dedication, −1 lost Rep, −1 Leader in Recovery.</li><li><strong>Bleed the Captive:</strong> +1; the captive rolls a Lasting Injury of 50+D6, is placed within 12" of the centre; enemies within 1" can Free Captive (Simple) – pass Intelligence to capture, fail and the captive returns Humiliated.</li><li><strong>Defilement:</strong> a fighter in the crew starts with D3 Flesh Wounds; +1 per wound.</li><li><strong>9+:</strong> the chosen power's favour for one battle; the focus gains +D6 XP. <strong>4 or less:</strong> the focus becomes a Chaos Spawn.</li></ol>`),
  ...(D().key==='undivided'?Object.keys(FAV):[D().fav]).map(k=>{const F2=FAV[k];return rb(`${F2.r} – ${esc(F2.god)}`,ul([`<strong>Blessing:</strong> ${esc(F2.b[0])}`,`<strong>Boon:</strong> ${esc(F2.b[1])}`,`<strong>Warped:</strong> ${esc(F2.b[2])}`]))})]]);
 S.push(['injuries','Injuries & status',[rb('Lasting Injuries',`<p style="font-size:.9rem">After the battle, roll a D66 for each fighter taken Out of Action. Stat changes stack and are permanent.</p>`+tbl(['D66','Result','Effect'],LI.map(x=>`<tr><td class="c">${x.r}</td><td><strong>${x.n}</strong></td><td>${esc(x.t)}</td></tr>`)),true),
  rb('Fighter status',ul(['<strong>Active:</strong> available for battles.','<strong>In Recovery:</strong> misses the next battle, then returns to Active.','<strong>Critical (needs a Doc):</strong> dies after the battle unless treated with a Medical Escort post-battle action.','<strong>Captured:</strong> held by another gang until rescued, ransomed or traded.','<strong>Dead:</strong> removed from play; no longer counts towards gang cost.'])),
  rb('Chaos Cult exceptions',ul(['<strong>Amaranthine (Apostle):</strong> a Memorable Death passes to a random gang fighter as a Sacrifice; the Apostle takes Enfeebled and the Crooked Body Mutation. The Apostle can\u2019t be Captured.','<strong>Warp Denizen (Daemon):</strong> ignores all Lasting Injuries except Memorable Death.','<strong>Chaos Spawn:</strong> never suffers Lasting Injuries except Memorable Death.','<strong>Bleed the Captive:</strong> the captive rolls a Lasting Injury of 50+D6 (results 51–56).']))]]);
 S.push(['subplots','Sub-plots',[rb('Using sub-plots',ul(['Agree before the battle. Each player privately draws one card from a deck of playing cards.','A Joker is shown and discarded; draw two cards instead (repeat for more Jokers).','On completion reveal it, take the reward, and discard the card permanently.'])),
  ...Object.values(SP).map(s=>rb(`${s.sym} ${s.suit}: ${s.theme} <span class="pill">${s.reward}</span>`,tbl(['Card','Sub-plot','Condition and reward'],s.c.map((c,i)=>`<tr><td class="c">${RANKS[i]}</td><td><strong>${esc(c[0])}</strong></td><td>${esc(c[1])}</td></tr>`)),true))]]);
 return S}
const RBLURB={gang:'Founding, Chaos Cult rules, Brutes and Hangers-On',fighters:'Profiles, marks, skills and special rules',equipment:'Who can take what, limits and Rep',armoury:'Weapon profiles, armour and wargear',mutations:'The D66 Mutation table',wyrd:'The Aetheric Discipline',skills:'Skill access, Heresy and god skills',dedication:'Your god, its Mark and Daemon Rep',articles:'Delusion Dice and every Path of Damnation',rituals:'Dark Ritual and favours',injuries:'Lasting Injuries and fighter status',subplots:'The four suits of secret missions'};
let RS=null;
function renderRules(sub){RS=rulesSections();const sec=RS.find(x=>x[0]===sub);
 if(sec){const i=RS.indexOf(sec),prev=RS[i-1],next=RS[i+1];
  app.innerHTML=`<div class="codex"><nav class="toc" aria-label="Rules sections"><a href="#rules">← All rules</a>${RS.map(([id,t])=>`<a href="#rules-${id}" ${id===sub?'aria-current="page"':''}>${t}</a>`).join('')}</nav>
  <div><p class="crumbs"><a href="#rules">Rules</a> / ${sec[1]}</p><section class="csec" id="sec-${sec[0]}" style="border:0"><h2>${sec[1]}</h2>${sec[2].join('')}</section>
  <div class="row" style="justify-content:space-between">${prev?`<a class="btn" href="#rules-${prev[0]}">← ${prev[1]}</a>`:'<span></span>'}${next?`<a class="btn" href="#rules-${next[0]}">${next[1]} →</a>`:''}</div></div></div>`;return}
 app.innerHTML=`<div class="stack" style="gap:16px"><div><h2>Rules</h2><p class="muted">${esc(D().title)} · ${PATHS[G.path].n}. Pick a section, or search everything.</p></div>
 <input type="search" class="search" id="rules-q" placeholder="Search the rules – e.g. Frenzy, Scarce, Daemon" value="${esc(UI.rules||'')}" aria-label="Search rules">
 <div id="rules-body"></div></div>`;rulesBody()}
function rulesBody(){const b=document.getElementById('rules-body');if(!b)return;const q=(UI.rules||'').trim();
 if(!q){b.innerHTML=`<div class="rtiles">${RS.map(([id,t])=>`<a class="rtile" href="#rules-${id}"><strong>${t}</strong><span>${RBLURB[id]||''}</span></a>`).join('')}</div>`;return}
 b.innerHTML=RS.map(([id,t,blocks])=>`<section class="csec" id="sec-${id}"><h2><a href="#rules-${id}" style="color:inherit;text-decoration:none">${t} →</a></h2>${blocks.join('')}</section>`).join('')+'<p class="muted" id="noresults" hidden>Nothing matches that search.</p>';filterRules()}
function filterRules(){const q=(UI.rules||'').trim().toLowerCase();let any=false;document.querySelectorAll('.csec').forEach(sec=>{let vis=false;
 sec.querySelectorAll('.rb').forEach(b=>{let show=!q||b.textContent.toLowerCase().includes(q);
  if(q&&show){b.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hidden-by-search',!tr.textContent.toLowerCase().includes(q)&&!tr.classList.contains('grp')&&!b.querySelector('h3')?.textContent.toLowerCase().includes(q)))}else b.querySelectorAll('tbody tr').forEach(tr=>tr.classList.remove('hidden-by-search'));
  b.classList.toggle('hidden-by-search',!show);if(show)vis=true});sec.classList.toggle('hidden-by-search',!vis);if(vis)any=true});
 const nr=document.getElementById('noresults');if(nr)nr.hidden=any}
app.addEventListener('input',e=>{if(e.target.id==='rules-q'){UI.rules=e.target.value;saveUI();rulesBody()}});
app.addEventListener('click',e=>{const a=e.target.closest('[data-jump]');if(!a)return;e.preventDefault();document.getElementById('sec-'+a.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})});

/* Easter egg: click the "Eightfold Path" title 8 times to recruit Scrunticus Maxicus Flathicus */
const SCRUNT_NAME='Scrunticus Maxicus Flathicus';
const SCRUNT_LINES=['The Dark Gods sigh. Scrunticus Maxicus Flathicus has joined the gang.','Scrunticus Maxicus Flathicus is already here. Nobody asked.','Scrunticus Maxicus Flathicus offers you a sharpened spoon. Decline it.','Scrunticus Maxicus Flathicus apologises for existing.','Somewhere, Scrunticus Maxicus Flathicus is losing a fight with a door.','Scrunticus Maxicus Flathicus has been found. Again. Unfortunately.'];
let scruntN=0;
function recruitScrunt(){G.scrunt=true;LS.set('ss-scrunt',true);
 const h=document.querySelector('.brand h1');h.classList.remove('quake');void h.offsetWidth;h.classList.add('quake');setTimeout(()=>h.classList.remove('quake'),900);
 let f=G.fighters.find(x=>x.type==='scrunt'&&cstat(x)!=='dead');
 if(f){toast(SCRUNT_LINES[1+(scruntN++%(SCRUNT_LINES.length-1))])}
 else{f=F('scrunt',SCRUNT_NAME,[],[],{open:true});G.fighters.forEach(x=>x.open=false);G.fighters.push(f);G.example=false;toast(SCRUNT_LINES[0])}
 save();UI.scrollTo=f.uid;saveUI();
 if((location.hash||'#build')==='#build')route();else location.hash='#build';
 requestAnimationFrame(()=>{const c=document.querySelector(`[data-uid="${f.uid}"]`);if(c){c.classList.add('quake');setTimeout(()=>c.classList.remove('quake'),900)}})}
(()=>{let n=0,t=0;document.querySelector('.brand h1').addEventListener('click',()=>{const now=Date.now();n=now-t<1500?n+1:1;t=now;if(n>=8){n=0;recruitScrunt()}})})();
/* skill datalist */
document.body.insertAdjacentHTML('beforeend',`<datalist id="skilllist">${ALLSKILLS.map(s=>`<option value="${esc(s[0])}">`).join('')}</datalist>`);
route();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
